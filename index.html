<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كيان للدعاية والإعلان</title>
    
    <!-- أيقونة الموقع (Favicon) -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://www2.0zz0.com/2025/10/26/20/127109061.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://www2.0zz0.com/2025/10/26/20/127109061.png">

    <!-- إضافة مكتبة Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- خط عصري وجريء (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- متغيرات التصميم ثلاثي الأبعاد --- */
        :root {
            --bg-color: #2D3561; /* لون الخلفية الداكن الناعم */
            --card-color: #3C4266; /* لون البطاقة (أفتح قليلاً من الخلفية) */
            --text-color: #EAEAEA; /* لون النص الفاتح */
            --accent-color: #64D2FF; /* لون مميز زاهٍ */
            --shadow-light: rgba(255, 255, 255, 0.1); /* الظل الخفيف (للأعلى) */
            --shadow-dark: rgba(0, 0, 0, 0.3); /* الظل الداكن (للأسفل) */
        }

        /* --- إعدادات عامة --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- البطاقة الرئيسية بتأثير Neumorphism --- */
        .neumorphic-card {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-color);
            padding: 60px 40px;
            border-radius: 25px;
            box-shadow: 9px 9px 16px var(--shadow-dark), -9px -9px 16px var(--shadow-light);
            text-align: center;
            position: relative;
        }

        /* --- الشعار --- */
        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px auto;
            background-color: var(--card-color);
            border-radius: 50%;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* --- الاسم والعنوان --- */
        .neumorphic-card h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(45deg, var(--accent-color), #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .neumorphic-card p {
            font-size: 1rem;
            color: var(--text-color);
            opacity: 0.8;
        }

        /* --- قائمة المعلومات (أزرار neumorphic) --- */
        .contact-list {
            list-style: none;
            margin: 40px 0;
        }

        .contact-list li {
            margin-bottom: 20px;
        }

        .neumorphic-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px 25px;
            background-color: var(--card-color);
            border-radius: 15px;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            color: var(--text-color);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .neumorphic-button:hover {
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
        }

        .neumorphic-button i {
            color: var(--accent-color);
            margin-left: 15px;
            font-size: 1.2rem;
        }

        /* === قسم الروابط الاجتماعية (تصميم دائري) === */
        .social-section {
            margin: 30px 0;
        }

        .social-links-wrapper {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .neumorphic-button--social {
            width: 50px;
            height: 50px;
            padding: 0; /* إزالة الحشو للأزرار الدائرية */
            border-radius: 50%; /* جعلها دائرية */
            font-size: 1.2rem; /* حجم الأيقونة */
        }

        /* --- قسم الدفع --- */
        .payment-section {
            margin-top: 30px;
        }

        .payment-section h3 {
            font-size: 0.9rem;
            color: var(--text-color);
            opacity: 0.7;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .qr-codes-wrapper {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .qr-box {
            background-color: var(--card-color);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
        }

        .qr-box img {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            background-color: #fff;
            padding: 5px;
        }

        .qr-box p {
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--text-color);
            font-weight: 600;
        }

        /* --- توقيع المصمم --- */
        .design-credit {
            margin-top: 40px;
            font-size: 0.75rem;
            color: var(--text-color);
            opacity: 0.6;
        }

        .design-credit a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        /* --- تجاوب مع الشاشات الصغيرة --- */
        @media (max-width: 600px) {
            .neumorphic-card { padding: 50px 30px; }
            .neumorphic-card h1 { font-size: 2rem; }
            .qr-codes-wrapper {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <main class="neumorphic-card">
        
        <!-- === الشعار === -->
        <div class="logo-container">
            <img src="https://www2.0zz0.com/2025/10/26/20/127109061.png" alt="شعار الشركة">
        </div>

        <!-- === الاسم والعنوان === -->
        <h1>كيان</h1>
        <p>للدعاية والإعلان</p>

        <!-- === قائمة المعلومات === -->
        <ul class="contact-list">
            <li>
                <a href="tel:201030566078+" class="neumorphic-button">
                    <span>201030566078+</span>
                    <i class="fas fa-phone"></i>
                </a>
            </li>
            <li>
                <a href="kian.adv.2025@gmail.com" class="neumorphic-button">
                    <span>kian.adv.2025@gmail.com</span>
                    <i class="fas fa-envelope"></i>
                </a>
            </li>
            <li>
                <a href="https://www.google.com/maps/search/?api=1&query=العنوان، شبرا الخيمة" target="_blank" class="neumorphic-button">
                    <span>العنوان، شبرا الخيمة</span>
                    <i class="fas fa-map-marker-alt"></i>
                </a>
            </li>
        </ul>

        <!-- === قسم الروابط الاجتماعية الجديد === -->
        <section class="social-section">
            <div class="social-links-wrapper">
                <a href="https://www.linkedin.com/in/%D9%85%D8%AD%D9%85%D8%AF-%D8%A7%D8%AD%D9%85%D8%AF-90ba85241/" target="_blank" class="neumorphic-button neumorphic-button--social" aria-label="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </a>
                <a href="https://x.com/2m2009" target="_blank" class="neumorphic-button neumorphic-button--social" aria-label="Twitter">
                    <i class="fab fa-twitter"></i>
                </a>
                <a href="https://www.facebook.com/mhmd.abw.ywsf.312557" target="_blank" class="neumorphic-button neumorphic-button--social" aria-label="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://www.instagram.com/mohamed_ahmed_abo_yossef/" target="_blank" class="neumorphic-button neumorphic-button--social" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
            </div>
        </section>
        
        <!-- === قسم الدفع === -->
        <section class="payment-section">
            <h3>طرق الدفع</h3>
            <div class="qr-codes-wrapper">
                <div class="qr-box">
                    <img src="https://www2.0zz0.com/2025/10/27/01/770802903.jpg" alt="Instapay QR Code">
                    <p>Instapay</p>
                </div>
                <div class="qr-box">
                    <img src="https://www2.0zz0.com/2025/10/27/01/185014759.jpg" alt="Vodafone Cash QR Code">
                    <p>Vodafone Cash</p>
                </div>
            </div>
        </section>

        <!-- === توقيع المصمم === -->
        <footer class="design-credit">
            <p>© 2025 Global Corp. | Designed by <a href="https://your-website.com" target="_blank">KYAIN For Advertising</a></p>
        </footer>

    </main>

</body>
</html>
